services:
  - type: web
    name: aegis-did
    runtime: node
    buildCommand: npm install && npm run db:migrate && npm run db:seed && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/blockchain/status
    disk:
      name: aegis-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_HASH_SALT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MST_NETWORK
        value: testnet
      - key: MST_RPC_URL
        value: https://testnetrpc.mstblockchain.com
      - key: MST_PRIVATE_KEY
        sync: false
      - key: MST_CREDENTIAL_REGISTRY_ADDRESS
        sync: false
      - key: VITE_MST_CHAIN_ID
        value: "0x5752035"
      - key: VITE_MST_NETWORK_NAME
        value: MST Testnet
      - key: VITE_MST_RPC_URL
        value: https://testnetrpc.mstblockchain.com
      - key: VITE_MST_EXPLORER_URL
        value: https://testnet.mstscan.com
      - key: VITE_MST_CREDENTIAL_REGISTRY_ADDRESS
        value: "0x8ea34e36670557A552c25F37A81b895Ca0535F6c"
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/aegisdid.db
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
